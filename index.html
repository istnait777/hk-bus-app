<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#d32f2f" />
  <title>HK Bus ETA</title>
  <link rel="manifest" href="manifest.json?v=4" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <header>
    <h1>HK Bus Live ETA</h1>
    <input type="search" id="routeInput" placeholder="Search route (e.g. 1A, 960, 290X)..." autocomplete="off" />
  </header>

  <main>
    <!-- Tab 1: Route Search Results -->
    <section id="routeList" class="card-list"></section>

    <!-- Tab 2: GPS Nearby Stops -->
    <section id="nearbySection" class="hidden">
      <div class="section-header">
        <strong>Nearby Stops (400m)</strong>
        <span id="gpsStatus">Locating...</span>
      </div>
      <div id="nearbyList"></div>
    </section>

    <!-- Tab 3: Bookmarked Stops + 1-Min Alert -->
    <section id="savedSection" class="hidden">
      <div class="section-header">
        <strong>Bookmarked Stops</strong>
        <span id="savedStatus">Keep open for 1m alert</span>
      </div>
      <div id="savedList"></div>
    </section>

    <!-- Tab 4: Time Remain Countdown View -->
    <section id="remainSection" class="hidden">
      <div class="section-header">
        <strong>Bus Time Remaining</strong>
        <span id="remainStatus">Live</span>
      </div>
      <div id="remainContent"></div>
    </section>

    <!-- Route Detail: Stops & Live ETAs -->
    <section id="stopSection" class="hidden">
      <div class="route-banner">
        <button id="backBtn">← Back</button>
        <div id="selectedRouteTitle"></div>
        <span id="refreshStatus">Live</span>
      </div>
      <div id="stopList" class="stop-list"></div>
    </section>
  </main>

  <!-- Pop-Up Window Modal for 1-Minute Bus Alert -->
  <div id="alertModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-icon">🚌🔔</div>
      <h2 id="alertModalTitle">Bus Arriving in 1 Min!</h2>
      <p id="alertModalBody">Your bus is almost at the stop.</p>
      <button id="alertModalOkBtn" class="modal-ok-btn">Got It</button>
    </div>
  </div>

  <!-- Floating Quick "Time Remain" Bar Above Bottom Nav -->
  <div id="floatingRemainBar" class="floating-remain hidden">
    <div id="floatingRemainText" class="floating-remain-info">
      <strong>--</strong> • Tap a time badge to track
    </div>
    <button id="floatingClearBtn" class="floating-close" title="Stop tracking">✕</button>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button id="tabRoutes" class="nav-btn active">
      <span class="nav-icon">🚌</span>
      <span>Routes</span>
    </button>
    <button id="tabNearby" class="nav-btn">
      <span class="nav-icon">📍</span>
      <span>Nearby</span>
    </button>
    <button id="tabSaved" class="nav-btn">
      <span class="nav-icon">⭐</span>
      <span>Saved</span>
    </button>
    <button id="tabRemain" class="nav-btn">
      <span class="nav-icon">⏱️</span>
      <span>Remaining</span>
    </button>
  </nav>

  <script src="app.js?v=4"></script>
</body>
</html>
